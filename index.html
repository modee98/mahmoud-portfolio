<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahmoud | Motion Graphics & 3D Artist</title>
<style>
:root {
--bg-color: #060608;
--primary: #ff0055;
--secondary: #00e5ff;
--accent: #ffbd00;
--text-color: #ffffff;
--text-muted: #a0a0a5;
--card-bg: rgba(22, 22, 27, 0.7);
--nav-bg: rgba(6, 6, 8, 0.85);
}
body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }
.bg-glow { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 10% 20%, rgba(255, 0, 85, 0.08) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 229, 255, 0.08) 0%, transparent 40%); z-index: -1; pointer-events: none; }
@keyframes customFadeUp { 0% { opacity: 0; transform: translateY(30px); filter: blur(5px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }

.navbar { position: fixed; top: 0; left: 0; width: 100%; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; box-sizing: border-box; z-index: 1000; flex-direction: row-reverse; }
.nav-logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; cursor: pointer; }
.nav-links { display: flex; gap: 30px; align-items: center; }
.nav-links a { color: var(--text-muted); text-decoration: none; font-size: 1rem; font-weight: 500; transition: color 0.3s, transform 0.3s; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.nav-links a:hover, .nav-links a.active { color: var(--text-color); transform: translateY(-2px); }
.nav-icon { font-size: 1.15rem; display: inline-block; }

.page { display: none; padding-top: 100px; min-height: calc(100vh - 100px); box-sizing: border-box; }
.page.active { display: block; animation: customFadeUp 0.5s ease forwards; }
.hero { height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
.hero h1 { font-size: 4.5rem; margin: 0; line-height: 1.2; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.emoji-fix { background: none !important; -webkit-background-clip: initial !important; -webkit-text-fill-color: initial !important; display: inline-block; }
.hero p { font-size: 1.3rem; color: var(--text-muted); max-width: 700px; line-height: 1.8; margin: 25px 0; }
.cta-btn { background: linear-gradient(90deg, var(--accent), #d4a017); color: #000; padding: 15px 35px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.1rem; box-shadow: 0 5px 20px rgba(255, 189, 0, 0.3); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
.cta-btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255, 189, 0, 0.5); }

.home-section { padding: 90px 8%; max-width: 1200px; margin: 0 auto; }
.home-section h2 { font-size: 2.8rem; text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #ffffff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.section-intro-text { text-align: center; color: var(--text-muted); font-size: 1.15rem; max-width: 700px; margin: 0 auto 60px auto; line-height: 1.8; }
.features-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
.feature-box { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.03); padding: 40px 30px; border-radius: 20px; transition: transform 0.3s, border-color 0.3s; }
.feature-box:hover { transform: translateY(-5px); border-color: var(--secondary); }
.feature-box h3 { font-size: 1.5rem; color: var(--secondary); margin-top: 0; }
.feature-box p { color: #ccccd0; line-height: 1.7; font-size: 1.05rem; }

.video-showcase-container { max-width: 950px; margin: 0 auto; padding: 10px; background: linear-gradient(135deg, rgba(255, 0, 85, 0.15), rgba(0, 229, 255, 0.15)); border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 229, 255, 0.1); overflow: hidden; }
.video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 16px; overflow: hidden; background-color: #000; }
.video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border: none; }

.stats-section { background: linear-gradient(180deg, transparent, rgba(255, 0, 85, 0.03), transparent); padding: 60px 5%; margin: 40px 0; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; max-width: 1100px; margin: 0 auto; text-align: center; }
.stat-item h4 { font-size: 3.5rem; margin: 0; background: linear-gradient(45deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
.stat-item p { color: var(--text-muted); font-size: 1.1rem; margin-top: 10px; }
.pipeline-container { display: flex; flex-direction: column; gap: 30px; max-width: 900px; margin: 0 auto; }
.pipeline-step { display: flex; align-items: flex-start; gap: 25px; background: rgba(255, 255, 255, 0.01); border-right: 4px solid var(--primary); padding: 25px 30px; border-radius: 0 16px 16px 0; }
.pipeline-step:nth-child(even) { border-right-color: var(--secondary); }
.step-number { font-size: 2rem; font-weight: 800; color: rgba(255, 255, 255, 0.1); line-height: 1; }
.step-content h3 { margin: 0 0 10px 0; font-size: 1.35rem; }
.step-content p { color: var(--text-muted); margin: 0; line-height: 1.7; }

.survey-section { padding: 80px 8%; max-width: 700px; margin: 60px auto 0 auto; background: radial-gradient(circle at top left, rgba(0, 229, 255, 0.04), transparent), var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 30px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
.survey-section h2 { font-size: 2.3rem; text-align: center; margin-bottom: 10px; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.survey-form { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
.form-group { display: flex; flex-direction: column; gap: 12px; }
.form-group label { font-size: 1rem; font-weight: 600; color: #e0e0e5; }
.form-control { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px 20px; border-radius: 12px; color: #fff; font-size: 1rem; font-family: inherit; transition: border-color 0.3s, box-shadow 0.3s; }
.form-control:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }

.radio-tile-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 25px; margin-top: 5px; }
.radio-tile-group input[type="radio"] { display: none; }
.radio-label { display: block; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); padding: 18px 10px; border-radius: 14px; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.radio-label:hover { border-color: rgba(0, 229, 255, 0.4); transform: translateY(-3px); color: #fff; }
.radio-tile-group input[type="radio"]:checked + .radio-label { background: rgba(255, 0, 85, 0.12); border-color: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(255, 0, 85, 0.2); transform: scale(1.02); }
.submit-btn { background: linear-gradient(90deg, var(--secondary), #00b2c4); color: #000; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; margin-top: 15px; }
.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 229, 255, 0.4); }
.status-msg { text-align: center; padding: 15px; border-radius: 12px; font-weight: bold; background: rgba(255, 255, 255, 0.05); color: var(--secondary); margin-bottom: 20px; display: none; border: 1px solid var(--secondary); }

.about-container, .software-container { max-width: 1000px; margin: 40px auto; padding: 0 5%; }
.about-card, .software-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 24px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.about-card h2, .software-card h2 { font-size: 2.5rem; margin-top: 0; color: var(--secondary); }
.about-card p, .software-card p { font-size: 1.15rem; line-height: 1.9; color: #d1d1d6; }
.skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
.skill-badge { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.2); padding: 25px 15px; border-radius: 12px; text-align: center; font-weight: 600; transition: all 0.3s ease; cursor: pointer; }
.skill-badge:hover { background: rgba(0, 229, 255, 0.1); border-color: var(--secondary); transform: translateY(-5px) scale(1.03); box-shadow: 0 10px 20px rgba(0, 229, 255, 0.1); }
.services-section { padding: 40px 5%; max-width: 1200px; margin: 0 auto; }
.section-title { text-align: center; font-size: 3rem; margin-bottom: 10px; background: linear-gradient(90deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.section-desc { text-align: center; color: var(--text-muted); margin-bottom: 60px; font-size: 1.1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 35px; }
.card { background: var(--card-bg); padding: 45px 35px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
.card:hover { transform: translateY(-12px); border-color: var(--hover-color, var(--primary)); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); }
.card::before { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 5px; background: var(--hover-color, var(--primary)); transform: scaleX(0); transform-origin: right; transition: transform 0.4s ease; }
.card:hover::before { transform: scaleX(1); }
.card .icon { font-size: 2.5rem; margin-bottom: 20px; }
.card h3 { font-size: 1.6rem; margin: 0 0 15px 0; }
.card p { color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; margin-bottom: 25px; }
.card .software-tag { display: inline-block; background: rgba(255, 255, 255, 0.04); padding: 6px 16px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; color: var(--hover-color); border: 1px solid rgba(255, 255, 255, 0.05); }
.back-btn { display: inline-block; margin-top: 30px; color: var(--primary); text-decoration: none; font-weight: bold; transition: transform 0.3s; cursor: pointer; }
.back-btn:hover { transform: translateX(-5px); }

/* تنسيقات الجدول */
.table-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 25px; }
table { width: 100%; border-collapse: collapse; text-align: right; background-color: rgba(0, 0, 0, 0.3); }
th { background: linear-gradient(90deg, var(--primary), #b3003b); color: #ffffff; padding: 16px 20px; font-weight: 700; font-size: 1.05rem; }
td { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); color: #e0e0e5; }

@media (max-width: 768px) { 
    .hero h1 { font-size: 2.5rem; } .hero p { font-size: 1.1rem; } .home-section h2 { font-size: 2rem; } 
    .navbar { padding: 12px 15px; flex-direction: column; gap: 12px; } 
    .nav-logo { font-size: 1.5rem; }
    .nav-links { gap: 15px; justify-content: center; width: 100%; }
    .nav-links a { font-size: 0.95rem; }
    .page { padding-top: 130px; }
}
</style>
</head>
<body>
<div class="bg-glow"></div>

<nav class="navbar">
<a href="#" class="nav-logo" onclick="event.preventDefault(); switchPage('home')">MAHMOUD</a>
<div class="nav-links">
<a href="#" id="link-home" class="active" onclick="event.preventDefault(); switchPage('home')"><span class="nav-icon">🏠</span>الرئيسية</a>
<a href="#" id="link-about" onclick="event.preventDefault(); switchPage('about')"><span class="nav-icon">👤</span>من أنا</a>
<a href="#" id="link-services" onclick="event.preventDefault(); switchPage('services')"><span class="nav-icon">💼</span>خدماتي</a>
</div>
</nav>

<div id="page-home" class="page active">
    <section class="hero">
        <h1>يوسف ابوشعر<span class="emoji-fix">🎬</span></h1>
        <p>أهلاً بك في مساحتي الإبداعية الرقمية، حيث ندمج شغف الفن بأعقد أساليب الحركة لنصنع محتوى مرئياً يخطف الأنظار ويترك بصمة لا تُنسى في الأذهان.</p>
        <a href="#" class="cta-btn" onclick="event.preventDefault(); switchPage('services')">اكتشف خدماتي <span class="emoji-fix">🚀</span></a>
    </section>

    <!-- باقي الأقسام كما هي -->
</div>

<script>
function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(page => { page.classList.remove('active'); });
    document.querySelectorAll('.nav-links a').forEach(link => { link.classList.remove('active'); });
    const targetPage = document.getElementById('page-' + pageId);
    if(targetPage) targetPage.classList.add('active');
    const targetLink = document.getElementById('link-' + pageId);
    if(targetLink) targetLink.classList.add('active');
    window.scrollTo(0, 0);
}

document.getElementById('surveyForm').addEventListener('submit', function(e) {
    e.preventDefault(); 
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('survey-status-msg');
    submitBtn.textContent = "جاري الإرسال الفني... ⏳";
    submitBtn.disabled = true;

    fetch('/submit-survey', { method: 'POST', body: new URLSearchParams(new FormData(this)) })
    .then(res => res.text())
    .then(data => {
        statusMsg.textContent = data;
        statusMsg.style.display = 'block';
        submitBtn.textContent = "إرسال الاستبيان الحين 🚀";
        submitBtn.disabled = false;
        if(data.includes("بنجاح")) this.reset();
    });
});
</script>
</body>
</html>
